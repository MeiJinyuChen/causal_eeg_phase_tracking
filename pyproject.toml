[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phasetracking"
version = "0.1.0"
description = "Causal phase tracking for closed-loop sleep neuromodulation: the cecHT streaming core, its contracts, the offline benchmark, and the host plugin."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "mne>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["causal_phase_tracking*"]
